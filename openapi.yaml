openapi: 3.1.0
info:
  title: Receipt DOCX Generator
  version: 1.0.10
servers:
  - url: https://receipt-action-server.onrender.com
paths:
  /create-receipt-docx:
    post:
      operationId: create_receipt_docx
      summary: Create receipt DOCX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipts]
              properties:
                receipts:
                  type: array
                  items:
                    type: object
                    required: [use_date, store, amount]
                    properties:
                      use_date: {type: string}
                      store: {type: string}
                      amount: {type: string}
                      receipt_image_url: {type: string}
                      receipt_image_base64: {type: string}
                      receipt_image_file_path: {type: string}
                openaiFileIdRefs:
                  type: array
                  description: GPT에 업로드된 파일 참조 배열. download_link 포함 가능.
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      id: {type: string}
                      mime_type: {type: string}
                      download_link: {type: string}
                card_name:
                  type: string
                  default: 중앙청년지원센터 법인카드(0000)
                user_name:
                  type: string
                  default: 중앙청년지원센터 매니저
                purpose:
                  type: string
                  default: ""
                output_filename:
                  type: string
                  default: 법인카드_영수증_증빙자료.docx
      responses:
        "200":
          description: DOCX 생성 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  download_url: {type: string}
                  filename: {type: string}
                  image_status: {type: string}
  /health:
    get:
      operationId: health
      summary: Health
      responses:
        "200":
          description: OK
