openapi: 3.1.0
info:
  title: Receipt DOCX Generator
  version: 1.0.9
servers:
  - url: https://receipt-action-server.onrender.com
paths:
  /health:
    get:
      operationId: health_health_get
      summary: Health
      responses:
        "200":
          description: Successful Response
  /create-receipt-docx:
    post:
      operationId: create_receipt_docx_create_receipt_docx_post
      summary: Create Receipt Docx
      description: >
        법인카드 영수증 증빙자료 DOCX를 생성하고 다운로드 URL을 반환합니다.
        MyGPT에 업로드된 영수증 이미지는 receipt_image_file_path 필드로 전달하세요.
        업로드 파일의 로컬 경로가 전달되면 플랫폼이 접근 가능한 URL로 변환할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
components:
  schemas:
    ReceiptItem:
      type: object
      required:
        - use_date
        - store
        - amount
      properties:
        use_date:
          type: string
          description: 영수증 사용일자. 반드시 YYYY-MM-DD 형식.
        store:
          type: string
          description: 영수증 상호명.
        amount:
          type: string
          description: 최종 승인금액. 예: 52,000원
        receipt_image_file_path:
          type: string
          description: >
            사용자가 MyGPT에 업로드한 영수증 이미지의 파일 경로를 넣습니다.
            예: /mnt/data/receipt.jpg
            이 필드는 Action 호출 시 플랫폼이 접근 가능한 파일 URL로 변환할 수 있도록 파일 인자로 사용합니다.
        receipt_image_url:
          type: string
          description: 외부에서 접근 가능한 영수증 이미지 URL. 예: https://.../receipt.png
        receipt_image_base64:
          type: string
          description: 선택값. 영수증 원본 이미지 base64.
    ReceiptRequest:
      type: object
      required:
        - receipts
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
        card_name:
          type: string
          default: 중앙청년지원센터 법인카드(0000)
        user_name:
          type: string
          default: 중앙청년지원센터 매니저
        purpose:
          type: string
          default: ""
        output_filename:
          type: string
          default: 법인카드_영수증_증빙자료.docx
    ReceiptResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        download_url:
          type: string
        filename:
          type: string
        image_status:
          type: string
